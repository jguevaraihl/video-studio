# Ejemplo de nginx para servir apps/web/dist con aislamiento entre orígenes.
# El puente de IA NO se publica: debe correr en el equipo del usuario (127.0.0.1).
server {
  listen 443 ssl;
  server_name estudio.example.com;
  root /var/www/estudio/dist;

  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Embedder-Policy "require-corp" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;

  types { application/wasm wasm; }

  location /ffmpeg/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
  }

  location / {
    try_files $uri /index.html;
  }
}
